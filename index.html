<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobHunt4U — Launching Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #111827);
      color: white;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 800px;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 20px;
      color: #3b82f6;
    }

    p {
      font-size: 1.3rem;
      line-height: 1.8;
      color: #d1d5db;
      margin-bottom: 20px;
    }

    .tagline {
      font-size: 1.1rem;
      color: #93c5fd;
      margin-top: 20px;
    }

    .badge {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 24px;
      border: 1px solid #3b82f6;
      border-radius: 30px;
      color: #3b82f6;
      font-size: 0.95rem;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.5rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>JobHunt4U</h1>

    <p>
      AI-powered job hunting platform currently under development.
    </p>

    <p>
      We are building an intelligent system to help professionals discover jobs,
      optimize resumes, improve ATS scores, track applications,
      and automate job search workflows.
    </p>

    <div class="badge">
      🚀 Launching Soon
    </div>

    <div class="tagline">
      Smarter Job Search Starts Here.
    </div>
  </div>
</body>
</html>
